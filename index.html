    <!--
      Analytics + Ads
      ---------------
      Google Tag (gtag.js) is loaded at runtime by /src/utils/tracking.ts
      only when a real GA4/Ads ID is present in the environment. See
      SITE_STATUS.md for how to wire in the real IDs. We intentionally do
      NOT hard-code placeholder IDs like GA_MEASUREMENT_ID here — those
      trigger a real 404 request to googletagmanager.com on every pageview
      and degrade Core Web Vitals and trust.
    -->

    <!-- Google Search Console verification (replace when Matt claims the property) -->
    <!-- <meta name="google-site-verification" content="YOUR_VERIFICATION_CODE_HERE" /> -->

    <!-- Legacy SPA redirect for deep links (harmless; GitHub Pages relic) -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>

    <!-- Silent onerror — prevents noisy runtime overlays on production -->
    <script type="text/javascript">
      window.onerror = function () {
        return false;
      };
    </script>
