
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    // Single Page Apps for GitHub Pages
    // MIT License
    // https://github.com/rafgraph/spa-github-pages
    // This script takes the current URL and converts the path and query
    // string into just a query string, and then redirects the browser
    // to the new URL with only a query string and hash fragment.

    // Parse the URL
    const l = window.location;
    const segmentCount = 1; // Adjust based on your repo name structure
    const repoName = l.pathname.split('/')[1];  
    
    // Only redirect if it's a 404 on a valid path
    if (l.pathname.split('/').length > segmentCount && 
        !l.pathname.includes('.') && 
        l.hostname !== 'localhost') {
      
      let redirectPath = l.pathname.slice(l.pathname.indexOf('/', 1));
      
      // Handle case when pathname is just the repo name (e.g., /repo-name/)
      if (redirectPath === '/' || !redirectPath) {
        redirectPath = '/';
      }
      
      // Build redirect URL
      let redirectUrl = l.protocol + '//' + l.hostname + 
                      (repoName ? '/' + repoName : '') + 
                      '/?redirect=' + encodeURIComponent(redirectPath) +
                      (l.search ? '&' + l.search.slice(1) : '') +
                      l.hash;
      
      // Redirect to the new URL
      window.location.replace(redirectUrl);
    }
  </script>
</head>
<body>
  <h1>Page not found</h1>
  <p>If you're not being redirected automatically, <a href="/">click here to go to the homepage</a>.</p>
</body>
</html>
