
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Symphony Smart Homes</title>
  <script>
    // Single Page Apps for GitHub Pages
    // MIT License
    var l = window.location;
    var path = l.pathname.slice(1);
    var base = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '');
    var redirectURL = base + '/#' + path + (l.search || '') + (l.hash || '');
    window.location.replace(redirectURL);
  </script>
</head>
<body>
  <p>Redirecting to homepage...</p>
</body>
</html>
